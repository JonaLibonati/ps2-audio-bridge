
name: Build PS2 ELF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PS2 app with PS2DEV
        run: |
          docker run --rm \
            --user 0 \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/ps2 \
            ghcr.io/ps2dev/ps2dev:latest \
            sh -ec '
              echo "Installing make..."
              apk add --no-cache make

              echo "Environment:"
              echo "PS2DEV=$PS2DEV"
              echo "PS2SDK=$PS2SDK"

              echo "Available compilers:"
              command -v mips64r5900el-ps2-elf-gcc || true
              command -v ee-gcc || true

              echo "Compiler directory:"
              ls -la "$PS2DEV/ee/bin" | head -30

              echo "Building PS2 Audio Bridge..."
              make clean
              make
            '

      - name: Upload ELF artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ps2-audio-bridge-elf
          path: ps2/ps2_audio_bridge_test.elf
          if-no-files-found: error
          retention-days: 14
